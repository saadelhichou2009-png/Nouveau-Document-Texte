name: Android Build Advanced

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # الانتقال لمجلد المشروع
          cd RATBot
          
          # التأكد من وجود ملف gradlew وإصلاحه
          if [ ! -f "gradlew" ]; then
            echo "❌ خطأ: ملف gradlew مفقود في مجلد RATBot!"
            exit 1
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nouveau-Document-Texte
          path: "RATBot/app/build/outputs/apk/debug/*.apk"
