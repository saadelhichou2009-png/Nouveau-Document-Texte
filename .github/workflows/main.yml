name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Force Build APK
      run: |
        # البحث عن ملف gradlew وإصلاح صلاحياته
        find . -name gradlew -exec chmod +x {} +
        
        # البحث عن المجلد الذي يحتوي على ملف البناء وتشغيله
        PROJECT_PATH=$(find . -name build.gradle.kts -exec dirname {} + | head -n 1)
        cd "$PROJECT_PATH"
        
        # إنشاء ملف gradle.properties لضمان تفعيل AndroidX
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ratbot-advanced-apk
        path: "**/app/build/outputs/apk/debug/*.apk"
